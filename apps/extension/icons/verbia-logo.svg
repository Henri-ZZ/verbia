<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Verbia app logo</title>
  <desc id="desc">Mint-to-cyan rounded square with two white and aqua leaves forming a V.</desc>
  <defs>
    <linearGradient id="tile" x1="125" y1="90" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63EDA2"/>
      <stop offset="0.48" stop-color="#20DDB9"/>
      <stop offset="1" stop-color="#29BEE5"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientTransform="translate(208 145) rotate(45) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9F7B8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#B9F7B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rightLeaf" x1="662" y1="250" x2="445" y2="735" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#FFFFFF"/>
      <stop offset=".78" stop-color="#C9FAF4"/>
      <stop offset="1" stop-color="#53D9DE"/>
    </linearGradient>
    <filter id="leafShadow" x="160" y="190" width="710" height="650" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#087F84" flood-opacity=".30"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="222" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="222" fill="url(#tileGlow)"/>
  <g filter="url(#leafShadow)">
    <path fill="url(#rightLeaf)" d="M462 715C500 594 528 475 591 380C639 307 708 259 811 236C813 347 799 452 755 542C699 655 611 717 462 715Z"/>
    <path fill="#FFFFFF" d="M230 322C334 337 407 391 450 486C481 555 489 637 561 748C457 766 375 731 319 661C246 570 220 455 230 322Z"/>
  </g>
</svg>
