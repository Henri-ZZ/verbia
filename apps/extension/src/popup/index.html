<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verbia</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="account.css"></head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon32.png" alt="" width="30" height="30"><h1>Verbia</h1></div>
    <button id="open-settings" class="dashboard-button" type="button" data-i18n-aria="popup.dashboard" aria-label="Dashboard"><img src="assets/dashboard.svg" alt="" width="16" height="16"><span data-i18n="popup.dashboard">Dashboard</span></button>
  </header>
  <main>
    <p id="page-notice" class="page-notice" role="status" hidden></p>
    <section class="hero"><span class="eyebrow">VERBIA</span><p class="lead" data-i18n="popup.lead">Draft replies in any language, right where you type.</p><div class="shortcut"><span id="popup-shortcut-keys" class="shortcut-keys" data-i18n-aria="settings.shortcutTitle" aria-label="Keyboard shortcut"></span><span data-i18n="popup.shortcutHint">Open reply panel.</span></div></section>
    <section id="auth-row" class="account-card" aria-live="polite"></section>
    <section id="site-row" class="account-card" aria-live="polite" hidden></section>
    <a id="contact-feedback" class="popup-feedback" href="https://verbia.henriz.dev/contact?source=popup" target="_blank" rel="noopener" data-i18n="common.contactFeedback">Contact/Feedback</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
