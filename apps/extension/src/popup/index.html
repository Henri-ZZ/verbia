<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbia</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="30" height="30">
      <h1>Verbia</h1>
    </div>
    <p class="slogan" data-i18n="brand.slogan">You mean it. Verbia says it.</p>
  </header>
  <main id="account">
    <p class="lead" data-i18n="popup.lead">Reply in any language, right where you type.</p>
    <p class="keys" data-i18n="popup.keys">Focus a text field, then press Ctrl+Shift+Y to open Verbia.</p>
    <p class="os" data-i18n="popup.os">Command+Shift+Y on Mac.</p>
    <div id="auth-row" class="auth-row" hidden></div>
  </main>
  <footer>
    <button id="open-settings" type="button" data-i18n="popup.settings">Settings</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
